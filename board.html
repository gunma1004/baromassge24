<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>커뮤니티 게시판</title>
  <!-- Supabase JS SDK 공식 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-javascript@2"></script>
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; margin: 0; padding: 0; }
    .container { max-width: 900px; margin: 40px auto; padding: 24px; background: #ffffff; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 16px; margin-bottom: 24px; }
    .header h1 { font-size: 24px; color: #1e293b; margin: 0; }
    .home-link { text-decoration: none; color: #3b82f6; font-weight: bold; font-size: 14px; }
    .post-item { border-bottom: 1px solid #f1f5f9; padding: 16px 0; }
    .post-item:last-child { border-bottom: none; }
    .badge { background-color: #e0f2fe; color: #0369a1; font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 6px; }
    .post-title { font-size: 18px; color: #0f172a; margin: 8px 0; }
    .post-content { color: #475569; font-size: 14px; line-height: 1.6; margin: 0; }
    .post-date { color: #94a3b8; font-size: 12px; margin-top: 8px; display: block; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>📌 커뮤니티 게시판</h1>
      <a href="index.html" class="home-link">← 홈으로 돌아가기</a>
    </div>

    <div id="post-list">글을 불러오는 중입니다...</div>
  </div>

  <script>
    const SUPABASE_URL = "https://ilyxesxzqbuswtfhqnww.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_MsZQkYYDbioESCVT3t7lGw_kyJQRqPg";

    async function loadPosts() {
      const postListElement = document.getElementById('post-list');

      // CDN 로드 상태 직접 체크
      if (typeof supabase === 'undefined' || !supabase.createClient) {
        if (postListElement) {
          postListElement.innerHTML = '<p style="color:red;">Supabase 모듈 로딩에 실패했습니다. 페이지를 새로고침해 주세요.</p>';
        }
        return;
      }

      const client = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

      const { data: posts, error } = await client
        .from('posts')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error('글 불러오기 오류:', error);
        if (postListElement) postListElement.innerHTML = '<p style="color:red;">글을 불러오는 중에 오류가 발생했습니다.</p>';
        return;
      }

      if (!posts || posts.length === 0) {
        if (postListElement) postListElement.innerHTML = '<p>등록된 게시글이 없습니다.</p>';
        return;
      }

      let htmlContent = '';
      posts.forEach(post => {
        const createdDate = new Date(post.created_at).toLocaleDateString('ko-KR', {
          year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
        });

        const formattedContent = (post.content || '').replace(/\n/g, '<br>');

        htmlContent += `
          <div class="post-item">
            <span class="badge">${post.category || '공지'}</span>
            <h3 class="post-title">${post.title}</h3>
            <div class="post-content">${formattedContent}</div>
            <span class="post-date">${createdDate}</span>
          </div>
        `;
      });

      if (postListElement) {
        postListElement.innerHTML = htmlContent;
      }
    }

    // 문서 및 모든 외부 스크립트 로드 완료 후 즉시 호출
    window.onload = function() {
      loadPosts();
    };
  </script>
</body>
</html>
