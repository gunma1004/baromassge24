<!-- Supabase JS SDK (최신버전 CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-javascript@2/dist/umd/supabase.js"></script>

  <script>
    const SUPABASE_URL = "https://ilyxesxzqbuswtfhqnww.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_MsZQkYYDbioESCVT3t7lGw_kyJQRqPg";
    
    // window.supabase.createClient 형태로 안전하게 호출
    const _supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY) : null;

    async function loadPosts() {
      if (!_supabase) {
        console.error('Supabase 라이브러리가 아직 로드되지 않았습니다.');
        document.getElementById('post-list').innerHTML = '<p style="color:red;">라이브러리 로딩 중 오류가 발생했습니다.</p>';
        return;
      }

      const { data: posts, error } = await _supabase
        .from('posts')
        .select('*')
        .order('created_at', { ascending: false });

      const postListElement = document.getElementById('post-list');

      if (error) {
        console.error('글 불러오기 오류:', error);
        postListElement.innerHTML = '<p style="color:red;">글을 불러오는 중에 오류가 발생했습니다.</p>';
        return;
      }

      if (!posts || posts.length === 0) {
        postListElement.innerHTML = '<p>등록된 게시글이 없습니다.</p>';
        return;
      }

      let htmlContent = '';
      posts.forEach(post => {
        const createdDate = new Date(post.created_at).toLocaleDateString('ko-KR', {
          year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
        });

        const formattedContent = (post.content || '').replace(/\n/g, '<br>');

        htmlContent += `
          <div class="post-item">
            <span class="badge">${post.category || '공지'}</span>
            <h3 class="post-title">${post.title}</h3>
            <div class="post-content">${formattedContent}</div>
            <span class="post-date">${createdDate}</span>
          </div>
        `;
      });

      postListElement.innerHTML = htmlContent;
    }

    // DOM이 완전히 로드된 후 실행
    document.addEventListener("DOMContentLoaded", () => {
      loadPosts();
    });
  </script>
